name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall Prisma client'ı üretir; veritabanı adresi gerekmez.
      - run: npm ci

      # Çalışma anında kullanılan paketlerde yüksek ya da kritik açık varsa CI kırmızıya döner.
      # Geliştirme araçları canlıya girmediği için taramaya katılmaz.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate
        working-directory: server
      # Testler sahte env değerleriyle çalışır (server/vitest.config.ts); gizli anahtar gerekmez.
      # Veritabanı testleri Testcontainers ile Docker'da PostgreSQL açar (Ubuntu makinesinde Docker hazır).
      - run: npm test
      - run: npm run build
